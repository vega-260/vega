user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream vega_api_servers {
        least_conn;
        server app-service-1:3000 max_fails=3 fail_timeout=10s;
        server app-service-2:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        client_max_body_size 15M;
        client_body_buffer_size 128k;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        # Socket.IO must never fall through to SPA routing.
        location /socket.io/ {
            proxy_pass http://vega_api_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
            proxy_buffering off;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # Health endpoints are intentionally lightweight and never cached.
        location /health/ {
            proxy_pass http://vega_api_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_cache_bypass 1;
            add_header Cache-Control "no-store" always;
        }

        # API requests use upstream keep-alive. WebSocket upgrade is handled above.
        location /api/ {
            proxy_pass http://vega_api_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_send_timeout 35s;
            proxy_read_timeout 120s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # Private metrics should normally be reachable only from the internal network.
        location /internal/ {
            proxy_pass http://vega_api_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # The React production bundle is served by the Node app image, so the edge
        # proxies SPA/static requests to the same horizontally-scaled application pool.
        location / {
            proxy_pass http://vega_api_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
